name: Windows portable

on:
  push:
    branches: [develop]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/media_tools/requirements-build.txt
      - run: npm ci
      - run: npm test
      - run: npm run test --workspace apps/web
      - run: npm run test --workspace apps/desktop
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit contained in main.' }
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($packageVersion -ne $tagVersion) { throw "Tag $tagVersion does not match package version $packageVersion." }
      - run: npm run desktop:package:win
      - name: Create checksum
        shell: pwsh
        run: Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: media-organizer-windows-x64-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release\*.exe release\SHA256SUMS.txt THIRD_PARTY_NOTICES.md --verify-tag --generate-notes --title "Media Organizer $env:GITHUB_REF_NAME"
